# wallboard broker.
# The LAN is the trust boundary: anonymous access is allowed, so anything on
# 192.168.88.0/24 can read state and issue commands. Do not port-forward these.
# persistence/persistence_location are already set in /etc/mosquitto/mosquitto.conf
# and must NOT be repeated here - mosquitto rejects duplicates and refuses to start.
allow_anonymous true

# native MQTT for the device daemon and for mosquitto_pub/sub debugging
listener 1883 0.0.0.0
protocol mqtt

# MQTT-over-WebSocket for the browser control page (a file:// page may use ws://)
listener 9001 0.0.0.0
protocol websockets
